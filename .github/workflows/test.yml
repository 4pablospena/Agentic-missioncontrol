name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  vitest-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: >-
          node -e "const p=require('./package.json'); const l=require('./package-lock.json');
          const w=p.devDependencies?.commander ?? p.dependencies?.commander;
          if (w && !l.packages?.['node_modules/commander'])
          { console.error('package-lock.json is missing hoisted commander; run npm install locally and commit package-lock.json'); process.exit(1); }"
      - run: npm ci
      - run: npm run test

  vitest-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: >-
          node -e "const p=require('./package.json'); const l=require('./package-lock.json');
          const w=p.devDependencies?.commander ?? p.dependencies?.commander;
          if (w && !l.packages?.['node_modules/commander'])
          { console.error('package-lock.json is missing hoisted commander; run npm install locally and commit package-lock.json'); process.exit(1); }"
      - run: npm ci
      - run: npm run test:integration
        env:
          NUXT_SESSION_PASSWORD: '01234567890123456789012345678901'

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: >-
          node -e "const p=require('./package.json'); const l=require('./package-lock.json');
          const w=p.devDependencies?.commander ?? p.dependencies?.commander;
          if (w && !l.packages?.['node_modules/commander'])
          { console.error('package-lock.json is missing hoisted commander; run npm install locally and commit package-lock.json'); process.exit(1); }"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true
          NUXT_SESSION_PASSWORD: '01234567890123456789012345678901'
          PLAYWRIGHT_DATABASE_PATH: /tmp/mc-playwright-ci.db
